{% extends 'news/base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-form">
        <div class="auth-header">
            <h2>🎮 С возвращением!</h2>
            <p>Войдите в свой аккаунт The Game Post</p>
        </div>
        
        <form method="post" class="auth-form-content">
            {% csrf_token %}
            
            <div class="form-row">
                <div class="form-group">
                    <label for="username">👤 Имя пользователя</label>
                    <input type="text" name="username" required class="form-input" id="username">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password">🔑 Пароль</label>
                    <input type="password" name="password" required class="form-input" id="password">
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                🚀 Войти в аккаунт
            </button>
        </form>
        
        <div class="auth-footer">
            <p>Нет аккаунта? <a href="{% url 'news:register' %}" class="auth-link">Зарегистрируйтесь здесь</a></p>
        </div>
    </div>
</div>
{% endblock %}
